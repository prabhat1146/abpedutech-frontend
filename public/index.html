<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />

    <!-- SEO -->
    <title>ABP EduTech | Notes, Tutorials & Government Exam Preparation</title>

    <meta
      name="description"
      content="ABP EduTech provides notes, PDF study materials, video tutorials, question banks, mock tests, and preparation resources for all government exams."
    />

    <meta
      name="keywords"
      content="ABP EduTech, government exam, notes PDF, question bank, online learning, video tutorials, SSC, UPSC, Railway, Banking, Bihar exams"
    />

    <meta name="author" content="ABP EduTech" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/logo/logo-1-1-round.png" />

    <!-- Apple Icon -->
    <link
      rel="apple-touch-icon"
      href="/assets/logo/logo-1-1.png"
    />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="ABP EduTech" />
    <meta
      property="og:description"
      content="Learn, Practice & Succeed with ABP EduTech."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/logo/logo-1-1.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global Style -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: #ffffff;
        color: #111827;
      }

      a {
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run ABP EduTech.
    </noscript>

    <div id="root"></div>
  </body>
</html>
